name: Build Python EXE

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài PyInstaller và thư viện
        run: |
          pip install pyinstaller

      - name: Đóng gói thành 1 file .exe
        run: |
          pyinstaller --onefile --name "facebook-bot" main.py

      - name: Tải file .exe lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: facebook-bot-windows
          path: dist/facebook-bot.exe
